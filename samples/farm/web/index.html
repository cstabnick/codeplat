<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Gossip Acres</title>
<style>
  :root {
    --bg-top: #1d2b53;
    --bg-bottom: #0b0f2a;
    --gold: #ffec27;
    --cream: #fff1e8;
    --btn: #ab5236;
    --btn-face: #c2c3c7;
    --btn-on: #ffa300;
    --ink: #000000;
  }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom)) no-repeat fixed;
    background-color: var(--bg-bottom);
    color: var(--cream);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    display: flex;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 100%;
    text-align: center;
  }
  h1 {
    margin: 12px 0 4px;
    font-size: clamp(28px, 7vw, 44px);
    letter-spacing: 0.08em;
    color: var(--gold);
    text-shadow: 3px 3px 0 var(--ink), 0 0 12px rgba(255, 236, 39, 0.35);
  }
  .subtitle {
    margin: 0 0 16px;
    font-size: 14px;
    color: var(--btn-face);
  }
  canvas#farm {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 4px solid var(--ink);
    background: var(--ink);
    box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.55);
    max-width: none;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 18px 0 10px;
  }
  .controls button {
    font: inherit;
    font-weight: bold;
    font-size: 14px;
    min-width: 64px;
    padding: 8px 12px;
    color: var(--cream);
    background: var(--btn);
    border: 3px solid var(--ink);
    border-radius: 0;
    box-shadow: inset -3px -3px 0 rgba(0, 0, 0, 0.35), 3px 3px 0 var(--ink);
    cursor: pointer;
  }
  .controls button:hover { filter: brightness(1.12); }
  .controls button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .controls button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .controls button.on { background: var(--btn-on); color: var(--ink); }
  .hint {
    margin: 8px 0 0;
    max-width: 46ch;
    font-size: 13px;
    line-height: 1.5;
    color: var(--btn-face);
  }
  @media (max-width: 400px) {
    .controls button { min-width: 0; flex: 1 1 30%; }
  }
</style>
</head>
<body>
<main>
  <h1>GOSSIP ACRES</h1>
  <p class="subtitle">A farm where everyone is talking. Except when Gary's looking.</p>
  <canvas id="farm" width="320" height="180" aria-label="Gossip Acres farm scene"></canvas>
  <div class="controls" role="group" aria-label="Controls">
    <button type="button" id="pause">Pause</button>
    <button type="button" id="speed-1">1x</button>
    <button type="button" id="speed-2">2x</button>
    <button type="button" id="speed-4">4x</button>
    <button type="button" id="skip">Skip to night/morning</button>
  </div>
  <p class="hint">Click an animal to hear what it's really thinking. Keys: Space, 1/2/4, N. Psst: try U after dark, or F.</p>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
